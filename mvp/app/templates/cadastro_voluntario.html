{% extends "base.html" %}
{% block titulo %}Seja voluntário · Apoio Escolar Periférico{% endblock %}
{% block conteudo %}
<section class="estreito">
  <h1>Seja monitor voluntário</h1>
  <p class="lead">Ofereça uma hora por semana, online ou presencial. Você escolhe a matéria e o horário.</p>
  {% if erro %}<p class="alerta" role="alert">{{ erro }}</p>{% endif %}
  <form method="post" action="/cadastro/voluntario" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="nome">Nome</label>
    <input id="nome" name="nome" required maxlength="120" autocomplete="name" value="{{ form.nome or '' }}">
    <label for="email">E-mail</label>
    <input id="email" name="email" type="email" required autocomplete="email" value="{{ form.email or '' }}">
    <label for="senha">Senha (mínimo 8 caracteres)</label>
    <input id="senha" name="senha" type="password" required minlength="8" autocomplete="new-password">
    <label for="formacao">Formação ou área <span class="opcional">(opcional)</span></label>
    <input id="formacao" name="formacao" maxlength="200" placeholder="Ex.: Licenciatura em Matemática" value="{{ form.formacao or '' }}">
    <button class="botao" type="submit">Criar conta de voluntário</button>
  </form>
</section>
{% endblock %}
