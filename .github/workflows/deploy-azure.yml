# Modelo de deploy para a disciplina de Secure DevOps (ajustar e assumir).
# Pré-requisitos no GitHub: secret AZURE_WEBAPP_PUBLISH_PROFILE e variável AZURE_WEBAPP_NAME.
# No App Service: SECRET_KEY, INTEGRATION_API_KEY, APP_ENV=production,
# DATABASE_URL=sqlite:////home/data/apoio.db (ou PostgreSQL) e comando de inicialização "sh startup.sh".
name: Deploy no Azure App Service

on:
  workflow_run:
    workflows: ["CI do MVP"]
    branches: [main]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') && vars.AZURE_WEBAPP_NAME != '' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: mvp
