# Atualizações automáticas de dependências (PRs semanais, que passam pelo CI antes do merge).
version: 2
updates:
  - package-ecosystem: pip
    directory: /mvp
    schedule:
      interval: weekly
    groups:
      opentelemetry:
        patterns: ["azure-monitor-*", "opentelemetry-*"]
  - package-ecosystem: pip
    directory: /dados
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
