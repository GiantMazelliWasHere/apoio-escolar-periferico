# Atualizações automáticas de dependências (PRs semanais, que passam pelo CI antes do merge).
version: 2
updates:
  - package-ecosystem: pip
    directory: /mvp
    schedule:
      interval: weekly
    groups:
      opentelemetry:
        patterns: ["azure-monitor-*", "opentelemetry-*"]
  - package-ecosystem: pip
    directory: /dados
    schedule:
      interval: weekly
    # A DAG e o docker-compose são do Airflow 2 (imports e CLI mudam no 3).
    ignore:
      - dependency-name: apache-airflow
        update-types: ["version-update:semver-major"]
      - dependency-name: pandas
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
